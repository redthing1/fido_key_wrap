[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "fido-key-wrap"
dynamic = ["version"]
description = "protect application root keys with passphrases and security keys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.maturin]
manifest-path = "crates/fido-key-wrap-python/Cargo.toml"
python-source = "python"
module-name = "fido_key_wrap._native"
bindings = "pyo3"
include = [{ path = "doc/*.md", format = "sdist" }]

[dependency-groups]
dev = ["maturin==1.14.1"]
